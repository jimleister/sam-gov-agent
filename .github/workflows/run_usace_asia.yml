name: SAM.gov — USACE / South and Southeast Asia

on:
  schedule:
    - cron: '0 11 * * *'  # 11:00 UTC (07:00 EDT / 06:00 EST)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore USACE/Asia opportunity state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=usace-asia-opportunity-state&per_page=10" --jq '.artifacts | map(select(.expired == false and .workflow_run.head_branch == "main")) | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > opportunity-state.zip
            unzip -oq opportunity-state.zip usace_asia_opportunity_state.json
          else
            python bootstrap_opportunity_state.py run_usace_asia.yml sam-results-usace-asia- usace_asia_opportunity_state.json
          fi

      - name: Run USACE + S/SE Asia script
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SEND_EMAIL: "1"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python script_usace_asia.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          if-no-files-found: warn
          name: sam-results-usace-asia-${{ github.run_number }}
          path: |
            sam_results_usace_asia_*.csv
            sam_results_usace_asia_*.xlsx
            email_draft.txt
            email_draft.html
            runtime_metrics.json

      - name: Save USACE/Asia opportunity state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          if-no-files-found: warn
          name: usace-asia-opportunity-state
          path: usace_asia_opportunity_state.json
