name: Validate SAM Gov Agent

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile all scanners
        run: |
          python -m py_compile sam_common.py script.py script_pest.py script_usace_asia.py script_inspection_oilgas.py script_catholic_southeast.py

      - name: Run offline tests
        run: python -m unittest discover -v

      - name: Preview all five watchlist migrations without SAM requests or email
        env:
          GH_TOKEN: ${{ github.token }}
        run: python preview_watchlist_migration.py

      - name: Upload migration preview
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-migration-preview
          path: migration-preview/
          retention-days: 30
