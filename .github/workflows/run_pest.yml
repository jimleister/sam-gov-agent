name: Run SAM Gov Agent (Pest/Vector)

on:
  schedule:
    - cron: '45 10 * * *'  # offset 15 min from logistics run to avoid simultaneous API calls
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pest/vector script
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SEND_EMAIL: "1"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python script_pest.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          if-no-files-found: warn
          name: sam-results-pest-${{ github.run_number }}
          path: |
            sam_results_pest_vector_*.csv
            sam_results_pest_vector_*.xlsx
            email_draft.txt
            email_draft.html
