name: SAM.gov — Catholic Southeast / Full North Carolina

on:
  schedule:
    - cron: '15 11 * * *'  # 11:15 UTC (07:15 EDT / 06:15 EST)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore last Catholic opportunity state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=catholic-opportunity-state&per_page=10" --jq '.artifacts | map(select(.expired == false and .workflow_run.head_branch == "main")) | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > catholic-state.zip
            unzip -oq catholic-state.zip catholic_opportunity_state.json
          fi

      - name: Run Catholic Southeast + NC script
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SEND_EMAIL: "1"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python script_catholic_southeast.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          if-no-files-found: warn
          name: sam-results-catholic-southeast-${{ github.run_number }}
          path: |
            sam_results_catholic_southeast_*.csv
            sam_results_catholic_southeast_*.xlsx
            email_draft.txt
            email_draft.html
            runtime_metrics.json

      - name: Save Catholic opportunity state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 30
          if-no-files-found: warn
          name: catholic-opportunity-state
          path: catholic_opportunity_state.json
