name: Run SAM Gov Agent (Catholic VA/GA/SC/KY/WV/DC + Full NC)

on:
  schedule:
    - cron: '15 11 * * *'  # 6:15 AM ET, 15 min after USACE + S/SE Asia run (11:00)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Run Catholic Southeast + NC script
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SEND_EMAIL: "1"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python script_catholic_southeast.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sam-results-catholic-southeast
          path: |
            sam_results_catholic_southeast_*.csv
            sam_results_catholic_southeast_*.xlsx
