name: Run SAM Gov Agent (USACE + S/SE Asia)

on:
  schedule:
    - cron: '0 11 * * *'  # 6:00 AM ET, 15 min after pest run (10:45) and 30 min after logistics (10:30)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Run USACE + S/SE Asia script
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SEND_EMAIL: "1"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python script_usace_asia.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sam-results-usace-asia
          path: |
            sam_results_usace_asia_*.csv
            sam_results_usace_asia_*.xlsx
